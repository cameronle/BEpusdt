name: Maintenance checks
on:
  workflow_dispatch:
  push:
    branches: [maintenance]
  pull_request:
    branches: [maintenance]
permissions:
  contents: read
concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build embedded administration and binary
        run: sh scripts/build-maintenance.sh
      - name: Tests, race detector and vet
        run: sh scripts/verify-maintenance.sh
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan working tree and fork-only commits
        run: sh scripts/scan-secrets.sh
